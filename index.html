 <!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media.css">

    <!-- Font Awesome Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="cont">

            <!-- box1 -->

            <div class="box1">

                <h2>Welcome to Sign In</h2>

            </div>

            <!-- box2 -->

            <div class="box2">

                <h1>Sign In</h1>

                <form class="for" id="loginForm">

                    <input type="email" id="email" placeholder="Email Address">

                    <div class="password-box">

                        <input type="password" id="password" placeholder="Password">

                        <i class="fa-solid fa-eye" id="showPassword"></i>

                    </div>

                    <p id="message"></p>

                    <button type="submit" class="btn-custom">Continue</button>

                    <p class="social-text">Or Connect with Social Media</p>

                    <a href="https://twitter.com/" target="_blank" class="btn-custom social-btn">

                        <i class="fa-brands fa-twitter"></i>

                        Sign in with Twitter

                    </a>

                    <a href="https://www.facebook.com/" target="_blank" class="btn-custom social-btn">

                        <i class="fa-brands fa-facebook-f"></i>

                        Sign in with Facebook

                    </a>

                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS Link -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <!-- JavaScript Link -->

    <script src="script.js"></script>

</body>
</html>
